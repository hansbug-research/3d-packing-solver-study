name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" matplotlib cffconvert==2.0.0
      - name: Recompute derived data
        run: python scripts/analyze.py
      - name: Reject derived data drift
        run: git diff --exit-code -- derived/
      - name: Regenerate figures
        run: python scripts/plot.py
      - name: Reject figure drift
        run: git diff --exit-code -- figures/
      - name: Rebuild raw manifest
        run: python scripts/build_manifest.py
      - name: Reject raw manifest drift
        run: git diff --exit-code -- raw/manifest.json
      - name: Verify evidence chain and metadata
        run: |
          cffconvert --validate --infile CITATION.cff
          python scripts/verify.py
          python scripts/check_markdown.py
          python scripts/check_links.py
      - name: Run contract tests
        run: python -m pytest -q
