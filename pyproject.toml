[project]
name = "packing-software-study"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ortools==9.15.6755",
  "py3dbp==1.1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "psutil>=6,<8", "matplotlib==3.11.1"]
exact = ["pyscipopt==6.2.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["benchmarks"]
